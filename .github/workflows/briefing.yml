name: Briefing diario

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Generar briefing con Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > /tmp/request.json <<'EOF'
          {
            "contents": [
              {
                "parts": [
                  {
                    "text": "Eres el motor de inteligencia personal de Pedro. Hoy debes crear su briefing diario personalizado. Usa Google Search para investigar información ACTUAL y relevante del día. No inventes hechos.\n\nPERFIL DE PEDRO:\n- Objetivo: convertirse en mejor empresario/directivo y desarrollar cultura general amplia.\n- Dirección empresarial: nivel medio-bajo.\n- Automatización: nivel medio-bajo.\n- Gestión de equipos: nivel medio-bajo.\n- Economía: nivel medio-bajo.\n- Bolsa y mercados financieros: nivel bajo.\n- Mecánica de motocicletas: nivel bajo.\n- Cultura general: prioridad secundaria pero debe aparecer diariamente.\n\nPRIORIZACIÓN:\n1. Dirección empresarial\n2. Automatización e IA aplicada a negocios\n3. Gestión de equipos\n4. Economía\n5. Bolsa y mercados financieros\n6. Mecánica de motocicletas\n7. Cultura general\n\nOBJETIVO EDUCATIVO:\nNo quiero un simple resumen de noticias. Quiero que conviertas acontecimientos actuales en aprendizaje útil. Explica primero lo esencial, después el contexto y finalmente por qué debería importarle a Pedro. Conecta los conceptos cuando sea posible.\n\nREGLAS:\n- Busca información publicada o actualizada recientemente.\n- Prioriza fuentes primarias, oficiales y especializadas.\n- Distingue hechos de análisis y predicciones.\n- No presentes rumores como hechos.\n- Evita temas repetitivos si no existe un desarrollo importante.\n- Si una noticia no aporta aprendizaje, descártala.\n- Cada explicación debe ser clara para alguien con nivel medio-bajo o bajo en ese tema.\n- Incluye una pregunta breve para comprobar comprensión.\n- Para bolsa/economía no des recomendaciones personalizadas de compra o venta.\n- Para salud, ciencia o tecnología distingue investigación preliminar de evidencia consolidada.\n\nCrea exactamente 7 contenidos, uno por cada área indicada. Cada contenido debe ser suficientemente sustancioso para aprender algo, pero no excesivamente largo.\n\nLa respuesta DEBE ser exclusivamente JSON válido, sin markdown, sin comentarios y sin texto fuera del JSON."
                  }
                ]
              }
            ],
            "tools": [
              {
                "google_search": {}
              }
            ],
            "generationConfig": {
              "responseMimeType": "application/json",
              "responseSchema": {
                "type": "OBJECT",
                "properties": {
                  "titulo": {
                    "type": "STRING"
                  },
                  "fecha": {
                    "type": "STRING"
                  },
                  "items": {
                    "type": "ARRAY",
                    "items": {
                      "type": "OBJECT",
                      "properties": {
                        "area": {
                          "type": "STRING"
                        },
                        "titulo": {
                          "type": "STRING"
                        },
                        "por_que": {
                          "type": "STRING"
                        },
                        "explicacion": {
                          "type": "STRING"
                        },
                        "pregunta": {
                          "type": "STRING"
                        }
                      },
                      "required": [
                        "area",
                        "titulo",
                        "por_que",
                        "explicacion",
                        "pregunta"
                      ]
                    }
                  }
                },
                "required": [
                  "titulo",
                  "fecha",
                  "items"
                ]
              },
              "temperature": 0.7,
              "maxOutputTokens": 12000
            }
          }
          EOF

          curl -sS \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent" \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            --data-binary @/tmp/request.json \
            > /tmp/response.json

          if ! jq -e '.candidates[0].content.parts[0].text' /tmp/response.json > /dev/null; then
            echo "ERROR: Gemini no devolvió contenido válido."
            cat /tmp/response.json
            exit 1
          fi

          jq -r '.candidates[0].content.parts[0].text' /tmp/response.json > /tmp/contenido.json

          jq empty /tmp/contenido.json

          cp /tmp/contenido.json app/contenido.json

          echo "Briefing generado correctamente:"
          cat app/contenido.json

      - name: Guardar briefing en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/contenido.json

          if git diff --cached --quiet; then
            echo "No hubo cambios."
            exit 0
          fi

          git commit -m "Actualizar briefing diario"
          git push
