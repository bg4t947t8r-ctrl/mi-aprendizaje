name: Briefing diario

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Generar briefing con Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > /tmp/request.json <<'EOF'
          {
            "contents": [
              {
                "parts": [
                  {
                    "text": "Actúa como el sistema personal de aprendizaje de Pedro. Genera el briefing diario en español. El objetivo no es hacer un resumen de noticias, sino ayudar a Pedro a convertirse en un mejor empresario y directivo mientras desarrolla una cultura general amplia. Su nivel actual es: Dirección empresarial medio-bajo; Automatización medio-bajo; Gestión de equipos medio-bajo; Economía medio-bajo; Bolsa y mercados financieros bajo; Motociclismo y mecánica bajo. También quiere cultura general amplia. Prioriza contenido realmente útil para aprender. Explica los conceptos de forma clara, práctica y progresiva, sin asumir conocimientos avanzados. Cuando hables de ciencia o salud, distingue entre evidencia consolidada, investigación preliminar y posibilidades. Cuando hables de mercados financieros, explica conceptos y contexto, pero no des recomendaciones personalizadas de compra o venta. Evita rumores, clickbait y afirmaciones no verificadas. Distingue claramente hechos, análisis y posibilidades. Conecta cuando sea útil un tema con otro para ayudar a construir una visión más amplia. Cada contenido debe terminar con una pregunta breve para comprobar comprensión. Genera exactamente 7 contenidos: uno de Dirección empresarial, uno de Automatización, uno de Gestión de equipos, uno de Economía, uno de Bolsa/mercados financieros, uno de Motociclismo/mecánica y uno de Cultura general. El contenido debe ser útil para el aprendizaje diario y no simplemente una lista de titulares. Devuelve únicamente JSON válido."
                  }
                ]
              }
            ],
            "generationConfig": {
              "responseMimeType": "application/json",
              "responseSchema": {
                "type": "OBJECT",
                "properties": {
                  "titulo": {
                    "type": "STRING"
                  },
                  "fecha": {
                    "type": "STRING"
                  },
                  "items": {
                    "type": "ARRAY",
                    "minItems": 7,
                    "maxItems": 7,
                    "items": {
                      "type": "OBJECT",
                      "properties": {
                        "area": {
                          "type": "STRING"
                        },
                        "titulo": {
                          "type": "STRING"
                        },
                        "por_que": {
                          "type": "STRING"
                        },
                        "explicacion": {
                          "type": "STRING"
                        },
                        "pregunta": {
                          "type": "STRING"
                        }
                      },
                      "required": [
                        "area",
                        "titulo",
                        "por_que",
                        "explicacion",
                        "pregunta"
                      ]
                    }
                  }
                },
                "required": [
                  "titulo",
                  "fecha",
                  "items"
                ]
              },
              "temperature": 0.7,
              "maxOutputTokens": 12000
            }
          }
          EOF

          for intento in 1 2 3 4 5; do
            echo "Intento $intento de 5..."

            HTTP_CODE=$(curl -sS \
              -o /tmp/response.json \
              -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              -H "x-goog-api-key: ${GEMINI_API_KEY}" \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent" \
              -d @/tmp/request.json)

            echo "Código HTTP: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Gemini respondió correctamente."
              break
            fi

            if [ "$HTTP_CODE" = "429" ] || [ "$HTTP_CODE" = "500" ] || [ "$HTTP_CODE" = "502" ] || [ "$HTTP_CODE" = "503" ] || [ "$HTTP_CODE" = "504" ]; then
              echo "Gemini está temporalmente ocupado. Esperando antes de reintentar..."
              sleep $((10 * intento))
            else
              echo "ERROR: Gemini devolvió un error no recuperable."
              cat /tmp/response.json
              exit 1
            fi
          done

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Gemini no respondió correctamente después de 5 intentos."
            cat /tmp/response.json
            exit 1
          fi

          cat /tmp/response.json

          CONTENT=$(jq -r '.candidates[0].content.parts[0].text // empty' /tmp/response.json)

          if [ -z "$CONTENT" ]; then
            echo "ERROR: Gemini no devolvió contenido válido."
            exit 1
          fi

          echo "$CONTENT" > /tmp/contenido.json

          jq empty /tmp/contenido.json || {
            echo "ERROR: Gemini devolvió JSON inválido."
            exit 1
          }

          cp /tmp/contenido.json app/contenido.json

      - name: Guardar briefing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/contenido.json

          if git diff --cached --quiet; then
            echo "No hubo cambios en el briefing."
          else
            git commit -m "Actualizar briefing diario"
            git push
          fi
