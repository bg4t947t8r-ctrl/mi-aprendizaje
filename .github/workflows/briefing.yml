name: Briefing diario

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  generar-y-publicar:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Obtener fecha actual de México
        id: fecha
        run: |
          echo "fecha=$(TZ=America/Mexico_City date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Obtener información actual gratuita
        run: |
          python3 <<'PY'
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          import json

          feeds = [
              ("Reuters", "site:reuters.com"),
              ("AP News", "site:apnews.com"),
              ("BBC", "site:bbc.com"),
              ("Economía", "economy economics inflation interest rates"),
              ("Mercados", "stock market markets finance"),
              ("IA y tecnología", "artificial intelligence AI technology"),
              ("Ciencia", "science technology research"),
              ("México", "Mexico business economy politics"),
              ("Negocios", "business entrepreneurship companies"),
              ("Motociclismo", "motorcycle motorcycles automotive")
          ]

          noticias = []

          for nombre, consulta in feeds:
              try:
                  params = urllib.parse.urlencode({
                      "q": consulta,
                      "hl": "es-419",
                      "gl": "MX",
                      "ceid": "MX:es-419"
                  })

                  url = "https://news.google.com/rss/search?" + params

                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      }
                  )

                  with urllib.request.urlopen(req, timeout=20) as response:
                      xml = response.read()

                  root = ET.fromstring(xml)

                  encontrados = 0

                  for item in root.findall(".//item"):
                      if encontrados >= 5:
                          break

                      titulo = item.findtext("title", "").strip()
                      enlace = item.findtext("link", "").strip()
                      fecha = item.findtext("pubDate", "").strip()
                      descripcion = item.findtext("description", "").strip()

                      if not titulo:
                          continue

                      noticias.append({
                          "fuente_busqueda": nombre,
                          "titulo": titulo,
                          "url": enlace,
                          "fecha": fecha,
                          "descripcion": descripcion[:500]
                      })

                      encontrados += 1

              except Exception as e:
                  print(f"No se pudo consultar {nombre}: {e}")

          with open("/tmp/noticias.json", "w", encoding="utf-8") as f:
              json.dump(noticias, f, ensure_ascii=False, indent=2)

          print(f"Noticias recopiladas: {len(noticias)}")
          PY

          if [ ! -s /tmp/noticias.json ]; then
            echo "ERROR: No se pudieron obtener noticias."
            exit 1
          fi

          echo "Primeras noticias obtenidas:"
          jq -r '.[0:10][] | "- \(.titulo)"' /tmp/noticias.json

      - name: Generar briefing con Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FECHA_ACTUAL: ${{ steps.fecha.outputs.fecha }}
        run: |

          python3 <<'PY'
          import json
          import os

          fecha = os.environ["FECHA_ACTUAL"]

          with open("/tmp/noticias.json", "r", encoding="utf-8") as f:
              noticias = json.load(f)

          noticias_texto = json.dumps(
              noticias,
              ensure_ascii=False,
              indent=2
          )

          prompt = f"""
          Actúa como el sistema personal de aprendizaje de Pedro.

          Hoy es {fecha}.

          La fecha del briefing DEBE ser exactamente {fecha}.

          Tu objetivo no es hacer un simple resumen de noticias.

          Tu función es convertir información actual del mundo en aprendizaje útil para Pedro, ayudándolo progresivamente a convertirse en un mejor empresario y directivo mientras desarrolla una cultura general amplia.

          PERFIL ACTUAL DE PEDRO:

          - Dirección empresarial: nivel medio-bajo.
          - Automatización: nivel medio-bajo.
          - Gestión de equipos: nivel medio-bajo.
          - Economía: nivel medio-bajo.
          - Bolsa y mercados financieros: nivel bajo.
          - Motociclismo y mecánica: nivel bajo.
          - Cultura general: quiere desarrollar una cultura amplia.

          PRINCIPIO FUNDAMENTAL:

          Las noticias son materia prima para aprender.

          No conviertas el briefing en una lista de titulares.

          Primero identifica qué información actual realmente vale la pena conocer.

          Después transforma esa información en una explicación educativa.

          Cuando una noticia sea solamente ruido, ignórala.

          Cuando una noticia permita enseñar un concepto importante, priorízala.

          GENERA EXACTAMENTE 7 CONTENIDOS:

          1. Dirección empresarial.
          2. Automatización.
          3. Gestión de equipos.
          4. Economía.
          5. Bolsa y mercados financieros.
          6. Motociclismo y mecánica.
          7. Cultura general.

          PARA CADA CONTENIDO:

          - Utiliza información actual cuando sea relevante.
          - Si existe una noticia actual importante relacionada con el área, úsala como punto de partida.
          - No fuerces una noticia cuando no exista una relevante.
          - Explica primero la idea central de forma sencilla.
          - Después profundiza progresivamente.
          - Incluye ejemplos concretos cuando ayuden.
          - Explica por qué ese conocimiento puede ser útil para Pedro.
          - Relaciona el concepto con otras ideas cuando exista una conexión clara.
          - Termina con una pregunta breve que permita comprobar si Pedro entendió.

          CAMPOS:

          area: nombre del área.

          titulo: título claro y atractivo.

          por_que: explica por qué Pedro debería dedicar tiempo a aprender esto.

          explicacion: explicación completa, clara y práctica. No escribas solamente una definición. Si utilizas una noticia como punto de partida, explica qué ocurrió y después qué concepto debería aprender Pedro a partir de ello.

          conexion: explica una conexión útil con otro concepto, área o conocimiento.

          pregunta: pregunta breve para comprobar comprensión.

          fuente: nombre de la fuente utilizada. Si no se utilizó una noticia concreta, escribe "Conocimiento general".

          enlace: URL de la noticia utilizada. Si no se utilizó una noticia concreta, escribe "".

          IMPORTANTE SOBRE LAS FUENTES:

          Las noticias proporcionadas abajo provienen de feeds RSS de Google News.

          No inventes fuentes.

          No inventes URLs.

          Si utilizas una noticia, utiliza únicamente una fuente y URL que aparezcan en los datos proporcionados.

          Si una noticia no tiene información suficiente para enseñar algo útil, no la utilices.

          Puedes utilizar conocimiento general para explicar conceptos, pero no presentes como hechos actuales cosas que no estén respaldadas por las noticias proporcionadas.

          CALIDAD:

          - Evita contenido superficial.
          - Evita frases genéricas de motivación.
          - Evita clickbait.
          - No inventes estadísticas.
          - No inventes estudios.
          - No inventes empresas.
          - No inventes eventos.
          - No presentes especulación como hecho.
          - Distingue hechos, análisis y posibilidades.
          - En ciencia y salud distingue evidencia consolidada, investigación preliminar y posibilidades.
          - En mercados financieros explica conceptos y contexto, pero NO des recomendaciones personalizadas de compra o venta.
          - En motociclismo y mecánica explica conceptos técnicos de manera que alguien con conocimientos bajos pueda entenderlos.
          - En dirección, automatización y equipos prioriza conocimientos que puedan ayudar a Pedro en su desarrollo como empresario y director.
          - En cultura general busca temas que amplíen su comprensión del mundo.

          VARIEDAD:

          No repitas siempre los mismos conceptos.

          Busca variedad entre:

          - fundamentos
          - conceptos nuevos
          - casos
          - principios
          - errores comunes
          - modelos mentales
          - acontecimientos actuales
          - conexiones entre áreas

          PRINCIPIO EDUCATIVO:

          Es preferible enseñar muy bien un concepto importante que mencionar muchos superficialmente.

          DATOS ACTUALES DISPONIBLES:

          {noticias_texto}

          Devuelve únicamente JSON válido.
          """

          schema = {
              "type": "OBJECT",
              "properties": {
                  "titulo": {
                      "type": "STRING"
                  },
                  "fecha": {
                      "type": "STRING"
                  },
                  "items": {
                      "type": "ARRAY",
                      "minItems": 7,
                      "maxItems": 7,
                      "items": {
                          "type": "OBJECT",
                          "properties": {
                              "area": {
                                  "type": "STRING"
                              },
                              "titulo": {
                                  "type": "STRING"
                              },
                              "por_que": {
                                  "type": "STRING"
                              },
                              "explicacion": {
                                  "type": "STRING"
                              },
                              "conexion": {
                                  "type": "STRING"
                              },
                              "pregunta": {
                                  "type": "STRING"
                              },
                              "fuente": {
                                  "type": "STRING"
                              },
                              "enlace": {
                                  "type": "STRING"
                              }
                          },
                          "required": [
                              "area",
                              "titulo",
                              "por_que",
                              "explicacion",
                              "conexion",
                              "pregunta",
                              "fuente",
                              "enlace"
                          ]
                      }
                  }
              },
              "required": [
                  "titulo",
                  "fecha",
                  "items"
              ]
          }

          request = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "responseMimeType": "application/json",
                  "responseSchema": schema,
                  "temperature": 0.7,
                  "maxOutputTokens": 12000
              }
          }

          with open("/tmp/request.json", "w", encoding="utf-8") as f:
              json.dump(request, f, ensure_ascii=False)

          print("Request JSON creado correctamente.")
          PY

          for intento in 1 2 3 4 5; do
            echo "Intento $intento de 5..."

            HTTP_CODE=$(curl -sS \
              -o /tmp/response.json \
              -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              -H "x-goog-api-key: ${GEMINI_API_KEY}" \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent" \
              -d @/tmp/request.json)

            echo "Código HTTP: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Gemini respondió correctamente."
              break
            fi

            if [ "$HTTP_CODE" = "429" ] || [ "$HTTP_CODE" = "500" ] || [ "$HTTP_CODE" = "502" ] || [ "$HTTP_CODE" = "503" ] || [ "$HTTP_CODE" = "504" ]; then
              echo "Gemini está temporalmente ocupado. Esperando antes de reintentar..."
              sleep $((10 * intento))
            else
              echo "ERROR: Gemini devolvió un error no recuperable."
              cat /tmp/response.json
              exit 1
            fi
          done

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Gemini no respondió correctamente después de 5 intentos."
            cat /tmp/response.json
            exit 1
          fi

          CONTENT=$(jq -r '.candidates[0].content.parts[0].text // empty' /tmp/response.json)

          if [ -z "$CONTENT" ]; then
            echo "ERROR: Gemini no devolvió contenido válido."
            cat /tmp/response.json
            exit 1
          fi

          echo "$CONTENT" > /tmp/contenido.json

          jq empty /tmp/contenido.json || {
            echo "ERROR: Gemini devolvió JSON inválido."
            cat /tmp/contenido.json
            exit 1
          }

          FECHA_JSON=$(jq -r '.fecha // empty' /tmp/contenido.json)

          if [ "$FECHA_JSON" != "$FECHA_ACTUAL" ]; then
            echo "ERROR: La fecha generada por Gemini no coincide."
            echo "Esperada: $FECHA_ACTUAL"
            echo "Recibida: $FECHA_JSON"
            exit 1
          fi

          cp /tmp/contenido.json app/contenido.json

      - name: Guardar briefing en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/contenido.json

          if git diff --cached --quiet; then
            echo "No hubo cambios en el briefing."
          else
            git commit -m "Actualizar briefing diario"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio a GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
