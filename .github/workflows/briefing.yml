name: Briefing diario

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  generar-y-publicar:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Obtener fecha actual de México
        id: fecha
        run: |
          echo "fecha=$(TZ=America/Mexico_City date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Generar briefing con Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FECHA_ACTUAL: ${{ steps.fecha.outputs.fecha }}
        run: |
          cat > /tmp/request.json <<EOF
          {
            "contents": [
              {
                "parts": [
                  {
                    "text": "Actúa como el sistema personal de aprendizaje de Pedro. Hoy es ${FECHA_ACTUAL}. La fecha del briefing DEBE ser exactamente ${FECHA_ACTUAL}. No uses otra fecha.

          El objetivo no es hacer un simple resumen de noticias. Tu función es ayudar a Pedro a convertirse progresivamente en un mejor empresario y directivo mientras desarrolla una cultura general amplia.

          PERFIL ACTUAL DE PEDRO:
          - Dirección empresarial: nivel medio-bajo.
          - Automatización: nivel medio-bajo.
          - Gestión de equipos: nivel medio-bajo.
          - Economía: nivel medio-bajo.
          - Bolsa y mercados financieros: nivel bajo.
          - Motociclismo y mecánica: nivel bajo.
          - Cultura general: quiere desarrollar una cultura amplia.
          
          PRINCIPIO DE APRENDIZAJE:
          Cada contenido debe ayudar a construir conocimiento, no solamente informar. Prioriza conceptos importantes, explicaciones claras y conexiones entre ideas.
          
          GENERA EXACTAMENTE 7 CONTENIDOS:
          1. Dirección empresarial.
          2. Automatización.
          3. Gestión de equipos.
          4. Economía.
          5. Bolsa y mercados financieros.
          6. Motociclismo y mecánica.
          7. Cultura general.
          
          PARA CADA CONTENIDO:
          - Elige un concepto que realmente valga la pena aprender.
          - Explica primero la idea central de forma sencilla.
          - Después profundiza progresivamente.
          - Incluye ejemplos concretos cuando ayuden.
          - Explica por qué ese conocimiento puede ser útil para Pedro.
          - Relaciona el concepto con otras ideas cuando exista una conexión clara.
          - Termina con una pregunta breve que permita comprobar si Pedro entendió.
          
          CAMPOS:
          area: nombre del área.
          titulo: título claro y atractivo.
          por_que: explica por qué Pedro debería dedicar tiempo a aprender esto.
          explicacion: explicación completa, clara y práctica. No escribas solamente una definición.
          conexion: explica una conexión útil con otro concepto, área o conocimiento. Si no existe una conexión relevante, escribe una conexión sencilla y honesta.
          pregunta: pregunta breve para comprobar comprensión.
          
          CALIDAD:
          - Evita contenido superficial.
          - Evita frases genéricas de motivación.
          - Evita clickbait.
          - No inventes estadísticas, estudios, empresas, eventos o hechos.
          - No presentes especulación como hecho.
          - Distingue hechos, análisis y posibilidades cuando corresponda.
          - En ciencia y salud distingue evidencia consolidada, investigación preliminar y posibilidades.
          - En mercados financieros explica conceptos y contexto, pero NO des recomendaciones personalizadas de compra o venta.
          - En motociclismo y mecánica explica conceptos técnicos de manera que alguien con conocimientos bajos pueda entenderlos.
          - En dirección, automatización y equipos prioriza conocimientos que puedan ayudar a Pedro en su desarrollo como empresario y director.
          - En cultura general busca temas que amplíen su comprensión del mundo y que puedan conectarse con otras áreas.
          
          VARIEDAD:
          No repitas siempre los mismos conceptos. Busca variedad entre fundamentos, conceptos nuevos, casos, principios, errores comunes, modelos mentales y conexiones.
          
          IMPORTANTE:
          El contenido debe estar pensado para una sesión diaria de aprendizaje. Es preferible enseñar muy bien un concepto que mencionar muchos superficialmente.
          
          Devuelve únicamente JSON válido."
                  }
                ]
              }
            ],
            "generationConfig": {
              "responseMimeType": "application/json",
              "responseSchema": {
                "type": "OBJECT",
                "properties": {
                  "titulo": {
                    "type": "STRING"
                  },
                  "fecha": {
                    "type": "STRING"
                  },
                  "items": {
                    "type": "ARRAY",
                    "minItems": 7,
                    "maxItems": 7,
                    "items": {
                      "type": "OBJECT",
                      "properties": {
                        "area": {
                          "type": "STRING"
                        },
                        "titulo": {
                          "type": "STRING"
                        },
                        "por_que": {
                          "type": "STRING"
                        },
                        "explicacion": {
                          "type": "STRING"
                        },
                        "conexion": {
                          "type": "STRING"
                        },
                        "pregunta": {
                          "type": "STRING"
                        }
                      },
                      "required": [
                        "area",
                        "titulo",
                        "por_que",
                        "explicacion",
                        "conexion",
                        "pregunta"
                      ]
                    }
                  }
                },
                "required": [
                  "titulo",
                  "fecha",
                  "items"
                ]
              },
              "temperature": 0.7,
              "maxOutputTokens": 12000
            }
          }
          EOF

          for intento in 1 2 3 4 5; do
            echo "Intento $intento de 5..."

            HTTP_CODE=$(curl -sS \
              -o /tmp/response.json \
              -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              -H "x-goog-api-key: ${GEMINI_API_KEY}" \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent" \
              -d @/tmp/request.json)

            echo "Código HTTP: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Gemini respondió correctamente."
              break
            fi

            if [ "$HTTP_CODE" = "429" ] || [ "$HTTP_CODE" = "500" ] || [ "$HTTP_CODE" = "502" ] || [ "$HTTP_CODE" = "503" ] || [ "$HTTP_CODE" = "504" ]; then
              echo "Gemini está temporalmente ocupado. Esperando antes de reintentar..."
              sleep $((10 * intento))
            else
              echo "ERROR: Gemini devolvió un error no recuperable."
              cat /tmp/response.json
              exit 1
            fi
          done

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Gemini no respondió correctamente después de 5 intentos."
            cat /tmp/response.json
            exit 1
          fi

          CONTENT=$(jq -r '.candidates[0].content.parts[0].text // empty' /tmp/response.json)

          if [ -z "$CONTENT" ]; then
            echo "ERROR: Gemini no devolvió contenido válido."
            cat /tmp/response.json
            exit 1
          fi

          echo "$CONTENT" > /tmp/contenido.json

          jq empty /tmp/contenido.json || {
            echo "ERROR: Gemini devolvió JSON inválido."
            cat /tmp/contenido.json
            exit 1
          }

          FECHA_JSON=$(jq -r '.fecha // empty' /tmp/contenido.json)

          if [ "$FECHA_JSON" != "$FECHA_ACTUAL" ]; then
            echo "ERROR: La fecha generada por Gemini no coincide."
            echo "Esperada: $FECHA_ACTUAL"
            echo "Recibida: $FECHA_JSON"
            exit 1
          fi

          cp /tmp/contenido.json app/contenido.json

      - name: Guardar briefing en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/contenido.json

          if git diff --cached --quiet; then
            echo "No hubo cambios en el briefing."
          else
            git commit -m "Actualizar briefing diario"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio a GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
